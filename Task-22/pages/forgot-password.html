<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · CineVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/index.css" />
</head>
<body class="bg-base-100 text-base-content min-h-screen flex flex-col justify-between">
  <div id="navbar"></div>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-base-200 border border-base-300 shadow-2xl p-6 sm:p-8">
      <div class="text-center space-y-2 mb-6">
        <span class="inline-grid h-12 w-12 place-items-center rounded-2xl bg-primary text-primary-content text-2xl font-black shadow-lg shadow-primary/30">
          🔑
        </span>
        <h1 class="text-3xl font-black font-display tracking-tight">Reset Password</h1>
        <p class="text-xs text-base-content/60" id="stepDescription">
          Enter your registered email to receive a verification OTP.
        </p>
      </div>

      <div id="generalError" class="alert alert-error text-xs mb-4 hidden"></div>
      <div id="otpDisplayAlert" class="alert alert-info text-xs mb-4 hidden"></div>

      <!-- Step 1: Request OTP -->
      <form id="requestOtpForm" class="space-y-4">
        <div class="form-control">
          <label class="label"><span class="label-text font-medium text-xs">Email Address</span></label>
          <input type="email" id="reqEmail" required class="input input-bordered w-full" placeholder="you@domain.com" />
          <span id="reqEmailError" class="text-error text-xs mt-1 hidden"></span>
        </div>

        <button type="submit" id="requestOtpBtn" class="btn btn-primary w-full mt-2 font-bold shadow-md">
          Send Verification OTP
        </button>
      </form>

      <!-- Step 2: Enter OTP & New Password -->
      <form id="resetPasswordForm" class="space-y-4 hidden">
        <div class="form-control">
          <label class="label"><span class="label-text font-medium text-xs">Email Address</span></label>
          <input type="email" id="resetEmail" required readonly class="input input-bordered w-full bg-base-300 cursor-not-allowed" />
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium text-xs">6-Digit OTP</span></label>
          <input type="text" id="resetOtp" required maxlength="6" class="input input-bordered w-full text-center tracking-widest font-mono text-lg font-bold" placeholder="123456" />
          <span id="otpError" class="text-error text-xs mt-1 hidden"></span>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium text-xs">New Password</span></label>
          <input type="password" id="newPassword" required class="input input-bordered w-full" placeholder="••••••••" />
          <span id="new_passwordError" class="text-error text-xs mt-1 hidden"></span>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium text-xs">Confirm New Password</span></label>
          <input type="password" id="newPasswordConfirmation" required class="input input-bordered w-full" placeholder="••••••••" />
          <span id="new_password_confirmationError" class="text-error text-xs mt-1 hidden"></span>
        </div>

        <button type="submit" id="resetPasswordBtn" class="btn btn-primary w-full mt-2 font-bold shadow-md">
          Reset Password
        </button>
      </form>

      <div class="divider text-xs text-base-content/40 my-6">OR</div>

      <p class="text-center text-xs text-base-content/70">
        Remember your password?
        <a href="/login.html" class="font-bold text-primary hover:underline">Back to Sign in</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { clearErrors, showFieldErrors, setLoading, showToast } from "/js/auth.js";
    import "/js/navbar.js";

    const reqForm = document.getElementById("requestOtpForm");
    const resetForm = document.getElementById("resetPasswordForm");
    const generalError = document.getElementById("generalError");
    const otpAlert = document.getElementById("otpDisplayAlert");
    const stepDescription = document.getElementById("stepDescription");

    let savedEmail = "";

    reqForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();
      generalError.classList.add("hidden");
      otpAlert.classList.add("hidden");

      const btn = document.getElementById("requestOtpBtn");
      setLoading(btn, true, "Generating OTP...");
      savedEmail = document.getElementById("reqEmail").value.trim();

      try {
        const res = await fetch("/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: savedEmail }),
        });

        const body = await res.json();

        if (res.ok) {
          showToast("OTP generated successfully!");
          reqForm.classList.add("hidden");
          resetForm.classList.remove("hidden");
          document.getElementById("resetEmail").value = savedEmail;
          stepDescription.textContent = "Enter the 6-digit OTP and choose a new password.";

          if (body.otp) {
            otpAlert.innerHTML = `<span>Verification OTP: <strong class="font-mono text-sm underline">${body.otp}</strong> (Expires in 15 mins)</span>`;
            otpAlert.classList.remove("hidden");
          }
        } else {
          setLoading(btn, false);
          generalError.textContent = body.error || "User with this email not found";
          generalError.classList.remove("hidden");
        }
      } catch (err) {
        setLoading(btn, false);
        generalError.textContent = "Network error. Please try again.";
        generalError.classList.remove("hidden");
      }
    });

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();
      generalError.classList.add("hidden");

      const btn = document.getElementById("resetPasswordBtn");
      setLoading(btn, true, "Resetting password...");

      const otp = document.getElementById("resetOtp").value.trim();
      const new_password = document.getElementById("newPassword").value;
      const new_password_confirmation = document.getElementById("newPasswordConfirmation").value;

      try {
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: savedEmail,
            otp,
            new_password,
            new_password_confirmation,
          }),
        });

        const body = await res.json();

        if (res.ok) {
          showToast("Password reset successful! Please log in.");
          window.location.href = "/login.html";
        } else {
          setLoading(btn, false);
          if (body.errors) {
            showFieldErrors(body.errors);
          } else {
            generalError.textContent = body.error || "Failed to reset password";
            generalError.classList.remove("hidden");
          }
        }
      } catch (err) {
        setLoading(btn, false);
        generalError.textContent = "Network error. Please try again.";
        generalError.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reviews · CineVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/index.css" />
</head>
<body class="bg-base-100 text-base-content min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-black font-display tracking-tight">My Reviews</h1>
        <p class="text-sm text-base-content/60 mt-1">Manage ratings and impressions you've submitted.</p>
      </div>
      <a href="/home.html" class="btn btn-outline btn-sm">Browse Movies</a>
    </div>

    <div id="reviewsContainer" class="space-y-4">
      <div class="py-20 text-center">
        <span class="loading loading-spinner loading-lg text-primary"></span>
      </div>
    </div>
  </main>

  <!-- Edit Review Modal -->
  <dialog id="editReviewModal" class="modal">
    <div class="modal-box bg-base-200 border border-base-300 shadow-2xl">
      <h3 class="font-display font-bold text-xl mb-4">Edit Review</h3>
      <form id="editReviewForm" class="space-y-4">
        <input type="hidden" id="editReviewId" />
        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Rating (0 - 10)</span></label>
          <input type="number" id="editReviewNumber" min="0" max="10" required class="input input-bordered w-full" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Comment (optional)</span></label>
          <textarea id="editReviewComment" rows="3" class="textarea textarea-bordered w-full"></textarea>
        </div>
        <div class="modal-action">
          <button type="button" class="btn btn-ghost" onclick="editReviewModal.close()">Cancel</button>
          <button type="submit" id="saveReviewEditBtn" class="btn btn-primary">Update Review</button>
        </div>
      </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <script type="module">
    import { escapeHtml, requireAuth, showToast, formatDate, confirmAction } from "/js/auth.js";
    import "/js/navbar.js";

    async function init() {
      const user = await requireAuth();
      if (!user) return;

      const container = document.getElementById("reviewsContainer");

      try {
        const res = await fetch("/api/reviews/my");
        const body = await res.json();
        const reviews = body.data || [];

        if (reviews.length === 0) {
          container.innerHTML = `
            <div class="py-16 text-center bg-base-200/50 rounded-2xl border border-dashed border-base-300">
              <span class="text-4xl">✍️</span>
              <h3 class="mt-3 text-lg font-bold">No reviews yet</h3>
              <p class="text-sm text-base-content/60 mt-1">Start reviewing movies to build your collection!</p>
              <a href="/home.html" class="btn btn-primary btn-sm mt-4">Browse Movies</a>
            </div>`;
          return;
        }

        container.innerHTML = reviews.map(r => {
          const movie = r.movie || {};
          const posterUrl = movie.image ? `/uploads/${movie.image}` : `https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=300&q=80`;

          return `
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-5 bg-base-200 border border-base-300 rounded-2xl shadow-sm">
              <div class="flex items-center gap-4">
                <a href="/movie.html?id=${movie._id}" class="w-16 h-24 rounded-xl overflow-hidden bg-base-300 shrink-0 border border-base-content/10">
                  <img src="${posterUrl}" alt="${escapeHtml(movie.title)}" class="w-full h-full object-cover" />
                </a>
                <div class="space-y-1">
                  <span class="badge badge-primary font-black px-2.5 py-1 text-xs">★ ${r.number}/10</span>
                  <a href="/movie.html?id=${movie._id}" class="font-bold text-base hover:text-primary transition line-clamp-1 block">
                    ${escapeHtml(movie.title || 'Movie')} <span class="text-xs text-base-content/60">(${escapeHtml(movie.year || '')})</span>
                  </a>
                  <p class="text-xs text-base-content/70 line-clamp-2">${escapeHtml(r.comment || 'No comment provided.')}</p>
                  <p class="text-[11px] text-base-content/40">Reviewed on ${formatDate(r.createdAt)}</p>
                </div>
              </div>
              <div class="flex sm:flex-col gap-2 shrink-0 self-end sm:self-center">
                <button class="btn btn-outline btn-xs edit-rev-btn" data-id="${r._id}" data-num="${r.number}" data-comment="${escapeHtml(r.comment || '')}">Edit</button>
                <button class="btn btn-error btn-outline btn-xs delete-rev-btn" data-id="${r._id}">Delete</button>
              </div>
            </div>`;
        }).join("");

        document.querySelectorAll(".edit-rev-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            document.getElementById("editReviewId").value = btn.dataset.id;
            document.getElementById("editReviewNumber").value = btn.dataset.num;
            document.getElementById("editReviewComment").value = btn.dataset.comment;
            editReviewModal.showModal();
          });
        });

        document.querySelectorAll(".delete-rev-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            confirmAction({
              title: "Delete Review",
              message: "Are you sure you want to delete this review? This action cannot be undone.",
              onConfirm: async () => {
                try {
                  const res = await fetch(`/api/reviews/${btn.dataset.id}`, { method: "DELETE" });
                  if (res.ok) {
                    showToast("Review deleted");
                    window.location.reload();
                  } else {
                    showToast("Failed to delete review", "error");
                  }
                } catch {
                  showToast("Network error", "error");
                }
              },
            });
          });
        });

      } catch (err) {
        container.innerHTML = `<div class="py-10 text-center text-error">Failed to load reviews.</div>`;
      }
    }

    document.getElementById("editReviewForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const revId = document.getElementById("editReviewId").value;
      const number = document.getElementById("editReviewNumber").value;
      const comment = document.getElementById("editReviewComment").value;

      const res = await fetch(`/api/reviews/${revId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number, comment }),
      });

      if (res.ok) {
        showToast("Review updated");
        window.location.reload();
      } else {
        showToast("Failed to update review", "error");
      }
    });

    init();
  </script>
</body>
</html>

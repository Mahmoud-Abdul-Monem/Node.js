<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actor Profile · CineVerse</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/index.css" />
</head>
<body class="bg-base-100 text-base-content min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">
    <div id="loadingState" class="py-24 text-center">
      <span class="loading loading-spinner loading-lg text-primary"></span>
      <p class="mt-4 text-sm text-base-content/60">Loading actor profile...</p>
    </div>

    <div id="contentContainer" class="hidden space-y-10">
      <!-- Breadcrumbs & Actions -->
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="breadcrumbs text-sm">
          <ul>
            <li><a href="/actors.html">Actors</a></li>
            <li id="breadcrumbName" class="text-primary font-semibold truncate max-w-xs">Actor Details</li>
          </ul>
        </div>
        <div id="actorAdminActions" class="hidden flex items-center gap-2">
          <button id="editActorBtn" class="btn btn-outline btn-sm">Edit Actor</button>
          <button id="deleteActorBtn" class="btn btn-error btn-outline btn-sm">Delete Actor</button>
        </div>
      </div>

      <!-- Actor Hero / Bio -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 bg-base-200 border border-base-300 rounded-3xl p-6 sm:p-8 shadow-xl">
        <!-- Photo Gallery / Main Photo -->
        <div class="space-y-4">
          <div class="aspect-square rounded-2xl overflow-hidden shadow-2xl bg-base-300">
            <img id="mainActorPhoto" src="" alt="Actor Photo" class="w-full h-full object-cover" />
          </div>
          <!-- Additional thumbnails if more than 1 image -->
          <div id="thumbnailsRow" class="flex gap-2 overflow-x-auto pb-1"></div>
        </div>

        <!-- Info -->
        <div class="md:col-span-2 flex flex-col justify-between space-y-6">
          <div class="space-y-4">
            <span class="badge badge-primary font-semibold text-xs tracking-wider uppercase">Artist Profile</span>
            <h1 id="actorName" class="text-4xl sm:text-5xl font-black font-display tracking-tight"></h1>
            <div class="p-4 bg-base-300/50 rounded-2xl border border-base-300 space-y-2">
              <p class="text-xs font-semibold uppercase tracking-wider text-base-content/60">Personal Details</p>
              <p class="text-sm">
                <span class="text-base-content/60">Born:</span>
                <span id="actorBirthdate" class="font-medium text-base-content ml-2">Not specified</span>
              </p>
            </div>
          </div>

          <div class="stats bg-base-300 border border-base-content/10 shadow">
            <div class="stat py-3 px-5">
              <div class="stat-title text-xs">Total Features</div>
              <div id="statMovieCount" class="stat-value text-2xl text-primary font-black">0</div>
              <div class="stat-desc">Movies in database</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Filmography -->
      <div class="space-y-6">
        <h2 class="text-2xl font-black font-display">Filmography</h2>
        <div id="filmographyGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!-- Injected movies -->
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Actor Modal -->
  <dialog id="editActorModal" class="modal">
    <div class="modal-box bg-base-200 border border-base-300 shadow-2xl">
      <h3 class="font-display font-bold text-2xl mb-4">Edit Actor</h3>
      <form id="editActorForm" class="space-y-4">
        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Name</span></label>
          <input type="text" id="editActorName" name="name" required class="input input-bordered w-full" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Birthdate</span></label>
          <input type="date" id="editActorBirthdate" name="birthdate" class="input input-bordered w-full" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text font-medium">New Photos (Replaces current images)</span></label>
          <input type="file" name="images" multiple accept="image/*" class="file-input file-input-bordered w-full" />
        </div>
        <div class="modal-action">
          <button type="button" class="btn btn-ghost" onclick="editActorModal.close()">Cancel</button>
          <button type="submit" id="updateActorBtn" class="btn btn-primary">Update Actor</button>
        </div>
      </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <script type="module">
    import { escapeHtml, getCurrentUser, showToast, setLoading, formatDate, getActorImage, DEFAULT_ACTOR_IMAGE, confirmAction } from "/js/auth.js";
    import "/js/navbar.js";

    const params = new URLSearchParams(window.location.search);
    const actorId = params.get("id");

    if (!actorId) {
      window.location.href = "/actors.html";
    }

    let currentActor = null;

    async function loadActorDetails() {
      try {
        const user = await getCurrentUser();
        if (user) {
          document.getElementById("actorAdminActions").classList.remove("hidden");
        }

        const res = await fetch(`/api/actors/${actorId}`);
        if (!res.ok) {
          window.location.href = "/404.html";
          return;
        }

        const body = await res.json();
        currentActor = body.data;

        document.getElementById("loadingState").classList.add("hidden");
        document.getElementById("contentContainer").classList.remove("hidden");

        document.title = `${currentActor.name} · CineVerse`;
        document.getElementById("breadcrumbName").textContent = currentActor.name;
        document.getElementById("actorName").textContent = currentActor.name;

        if (currentActor.birthdate) {
          document.getElementById("actorBirthdate").textContent = formatDate(currentActor.birthdate);
        }

        const images = currentActor.images || [];
        const mainPhoto = document.getElementById("mainActorPhoto");
        mainPhoto.src = getActorImage(currentActor);
        mainPhoto.onerror = () => { mainPhoto.src = DEFAULT_ACTOR_IMAGE; };

        if (images.length > 1) {
          const thumbRow = document.getElementById("thumbnailsRow");
          thumbRow.innerHTML = images.map((img) => `
            <button type="button" class="w-14 h-14 rounded-lg overflow-hidden border-2 border-base-300 hover:border-primary transition shrink-0 thumb-btn" data-src="/uploads/${img}">
              <img src="/uploads/${img}" class="w-full h-full object-cover" onerror="this.src='${DEFAULT_ACTOR_IMAGE}'" />
            </button>
          `).join("");

          document.querySelectorAll(".thumb-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              mainPhoto.src = btn.dataset.src;
            });
          });
        }

        // Filmography
        const movies = currentActor.movies || [];
        document.getElementById("statMovieCount").textContent = movies.length;
        const filmGrid = document.getElementById("filmographyGrid");

        if (movies.length === 0) {
          filmGrid.innerHTML = `
            <div class="col-span-full py-12 text-center bg-base-200/50 rounded-2xl border border-dashed border-base-300">
              <p class="text-sm text-base-content/60">No movies found for this actor.</p>
            </div>`;
          return;
        }

        filmGrid.innerHTML = movies.map(m => {
          const posterUrl = m.image ? `/uploads/${m.image}` : `https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80`;
          return `
            <div class="card bg-base-200 border border-base-300 shadow-md hover:shadow-xl hover:-translate-y-1 transition duration-300 overflow-hidden flex flex-col justify-between">
              <figure class="aspect-[2/3] bg-base-300 overflow-hidden">
                <img src="${posterUrl}" alt="${escapeHtml(m.title)}" class="w-full h-full object-cover" loading="lazy" />
              </figure>
              <div class="card-body p-4 flex flex-col justify-between">
                <div>
                  <span class="badge badge-primary badge-sm font-bold mb-1">${escapeHtml(m.year)}</span>
                  <h3 class="font-bold text-base line-clamp-1 font-display" title="${escapeHtml(m.title)}">${escapeHtml(m.title)}</h3>
                </div>
                <div class="card-actions mt-3">
                  <a href="/movie.html?id=${m._id}" class="btn btn-outline btn-primary btn-sm w-full font-semibold">View Movie</a>
                </div>
              </div>
            </div>`;
        }).join("");

      } catch (err) {
        console.error(err);
      }
    }

    // Edit Actor
    document.getElementById("editActorBtn")?.addEventListener("click", () => {
      if (!currentActor) return;
      document.getElementById("editActorName").value = currentActor.name;
      if (currentActor.birthdate) {
        document.getElementById("editActorBirthdate").value = new Date(currentActor.birthdate).toISOString().split("T")[0];
      }
      editActorModal.showModal();
    });

    document.getElementById("editActorForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = document.getElementById("editActorForm");
      const formData = new FormData(form);
      const btn = document.getElementById("updateActorBtn");
      setLoading(btn, true, "Updating...");

      try {
        const res = await fetch(`/api/actors/${actorId}`, {
          method: "PATCH",
          body: formData,
        });

        if (res.ok) {
          showToast("Actor updated");
          window.location.reload();
        } else {
          setLoading(btn, false);
          showToast("Failed to update actor", "error");
        }
      } catch {
        setLoading(btn, false);
        showToast("Network error", "error");
      }
    });

    // Delete Actor
    document.getElementById("deleteActorBtn")?.addEventListener("click", () => {
      confirmAction({
        title: "Delete Actor",
        message: "Are you sure you want to delete this actor? They will also be removed from any movies.",
        onConfirm: async () => {
          try {
            const res = await fetch(`/api/actors/${actorId}`, { method: "DELETE" });
            if (res.ok) {
              showToast("Actor deleted");
              window.location.href = "/actors.html";
            } else {
              showToast("Failed to delete actor", "error");
            }
          } catch {
            showToast("Network error", "error");
          }
        },
      });
    });

    loadActorDetails();
  </script>
</body>
</html>

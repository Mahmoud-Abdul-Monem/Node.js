<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineVerse · Discover Cinema</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/index.css" />
</head>
<body class="bg-base-100 text-base-content min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <!-- Hero Banner -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-base-300 via-base-200 to-base-300 border border-base-content/10 p-8 sm:p-12 shadow-2xl">
      <div class="max-w-2xl space-y-4">
        <span class="badge badge-primary font-semibold tracking-wider uppercase text-xs">Film Archive</span>
        <h1 class="text-4xl sm:text-5xl font-black font-display tracking-tight text-base-content">
          Explore Cinema & Casts
        </h1>
        <p class="text-base-content/70 text-base sm:text-lg">
          Browse comprehensive film details, uncover talented actors, and read authentic community reviews.
        </p>
        <div id="heroActionContainer" class="pt-2">
          <!-- Injected if authenticated -->
        </div>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-base-200/60 p-4 rounded-xl border border-base-300">
      <form id="filterForm" class="flex flex-wrap flex-1 gap-3 w-full">
        <div class="relative flex-1 min-w-[200px]">
          <input
            type="text"
            id="searchInput"
            placeholder="Search movie title..."
            class="input input-bordered w-full pl-10"
          />
          <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <select id="actorSelect" class="select select-bordered min-w-[180px]">
          <option value="">All Actors</option>
        </select>

        <button type="submit" class="btn btn-primary">Filter</button>
        <button type="button" id="resetBtn" class="btn btn-ghost">Reset</button>
      </form>
    </div>

    <!-- Movies Grid -->
    <div id="moviesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full py-20 text-center">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <p class="mt-4 text-base-content/60 text-sm">Loading movies...</p>
      </div>
    </div>
  </main>

  <!-- Add Movie Modal -->
  <dialog id="addMovieModal" class="modal">
    <div class="modal-box max-w-2xl bg-base-200 border border-base-300 shadow-2xl">
      <h3 class="font-display font-bold text-2xl mb-4">Add New Movie</h3>
      <form id="addMovieForm" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Title *</span></label>
            <input type="text" name="title" required class="input input-bordered w-full" placeholder="e.g. Interstellar" />
            <span id="titleError" class="text-error text-xs mt-1 hidden"></span>
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Year *</span></label>
            <input type="number" name="year" required min="1888" max="2100" class="input input-bordered w-full" placeholder="e.g. 2014" />
            <span id="yearError" class="text-error text-xs mt-1 hidden"></span>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Director *</span></label>
            <input type="text" name="director" required class="input input-bordered w-full" placeholder="e.g. Christopher Nolan" />
            <span id="directorError" class="text-error text-xs mt-1 hidden"></span>
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Genres (comma-separated) *</span></label>
            <input type="text" name="genres" required class="input input-bordered w-full" placeholder="Sci-Fi, Adventure, Drama" />
            <span id="genresError" class="text-error text-xs mt-1 hidden"></span>
          </div>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">YouTube Trailer Link *</span></label>
          <input type="url" name="trailerLink" required class="input input-bordered w-full" placeholder="https://www.youtube.com/watch?v=..." />
          <span id="trailerLinkError" class="text-error text-xs mt-1 hidden"></span>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Description *</span></label>
          <textarea name="description" required rows="3" class="textarea textarea-bordered w-full" placeholder="Short movie summary..."></textarea>
          <span id="descriptionError" class="text-error text-xs mt-1 hidden"></span>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Cast / Actors</span></label>
          <div id="actorsChecklist" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-3 bg-base-300/50 rounded-lg border border-base-300">
            <span class="text-xs text-base-content/50">Loading actors...</span>
          </div>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Poster Image</span></label>
          <input type="file" name="image" accept="image/*" class="file-input file-input-bordered w-full" />
          <span id="imageError" class="text-error text-xs mt-1 hidden"></span>
        </div>

        <div class="modal-action">
          <button type="button" class="btn btn-ghost" onclick="addMovieModal.close()">Cancel</button>
          <button type="submit" id="saveMovieBtn" class="btn btn-primary">Save Movie</button>
        </div>
      </form>
    </div>
    <form method="dialog" class="modal-backdrop">
      <button>close</button>
    </form>
  </dialog>

  <script type="module">
    import { escapeHtml, getCurrentUser, showToast, setLoading, clearErrors, showFieldErrors } from "/js/auth.js";
    import "/js/navbar.js";

    let allActors = [];

    async function loadActorsDropdown() {
      try {
        const res = await fetch("/api/actors");
        if (!res.ok) return;
        const body = await res.json();
        allActors = body.data || [];

        const actorSelect = document.getElementById("actorSelect");
        const actorsChecklist = document.getElementById("actorsChecklist");

        actorSelect.innerHTML = `<option value="">All Actors</option>` +
          allActors.map(a => `<option value="${a._id}">${escapeHtml(a.name)}</option>`).join("");

        actorsChecklist.innerHTML = allActors.length
          ? allActors.map(a => `
              <label class="cursor-pointer label gap-2 bg-base-100 px-3 py-1.5 rounded-lg border border-base-300 hover:border-primary">
                <input type="checkbox" name="actors" value="${a._id}" class="checkbox checkbox-xs checkbox-primary" />
                <span class="label-text text-xs">${escapeHtml(a.name)}</span>
              </label>
            `).join("")
          : `<span class="text-xs text-base-content/50">No actors available. Add some first!</span>`;
      } catch (err) {
        console.error(err);
      }
    }

    async function loadMovies() {
      const search = document.getElementById("searchInput").value.trim();
      const actorId = document.getElementById("actorSelect").value;
      const params = new URLSearchParams();
      if (search) params.append("search", search);
      if (actorId) params.append("actor", actorId);

      const grid = document.getElementById("moviesGrid");
      grid.innerHTML = `
        <div class="col-span-full py-20 text-center">
          <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>`;

      try {
        const res = await fetch(`/api/movies?${params.toString()}`);
        const body = await res.json();
        const movies = body.data || [];

        if (movies.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full py-16 text-center bg-base-200/50 rounded-2xl border border-dashed border-base-300">
              <span class="text-4xl">🍿</span>
              <h3 class="mt-3 text-lg font-bold">No movies found</h3>
              <p class="text-sm text-base-content/60 mt-1">Try adjusting your search criteria or add a new movie.</p>
            </div>`;
          return;
        }

        grid.innerHTML = movies.map(m => {
          const posterUrl = m.image ? `/uploads/${m.image}` : `https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80`;
          const genresBadges = (m.genres || []).slice(0, 2).map(g => `<span class="badge badge-neutral badge-xs">${escapeHtml(g)}</span>`).join(" ");

          return `
            <div class="card bg-base-200 border border-base-300 shadow-md hover:shadow-xl hover:-translate-y-1 transition duration-300 flex flex-col h-full overflow-hidden">
              <figure class="relative aspect-[2/3] overflow-hidden bg-base-300">
                <img src="${posterUrl}" alt="${escapeHtml(m.title)}" class="w-full h-full object-cover transition duration-500 hover:scale-105" loading="lazy" />
                <span class="absolute top-3 right-3 badge badge-primary font-bold shadow-md">${escapeHtml(m.year)}</span>
              </figure>
              <div class="card-body p-4 flex flex-col justify-between flex-1">
                <div class="space-y-2">
                  <div class="flex flex-wrap gap-1">${genresBadges}</div>
                  <h2 class="card-title text-lg font-display font-bold leading-tight line-clamp-1" title="${escapeHtml(m.title)}">
                    ${escapeHtml(m.title)}
                  </h2>
                  <p class="text-xs text-base-content/60">Dir. <span class="font-medium text-base-content/80">${escapeHtml(m.director)}</span></p>
                  <p class="text-xs text-base-content/70 line-clamp-2">${escapeHtml(m.description)}</p>
                </div>
                <div class="card-actions pt-3 mt-auto">
                  <a href="/movie.html?id=${m._id}" class="btn btn-primary btn-sm w-full font-semibold">View Movie</a>
                </div>
              </div>
            </div>`;
        }).join("");
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full py-10 text-center text-error">Failed to load movies.</div>`;
      }
    }

    async function init() {
      const user = await getCurrentUser();
      const heroAction = document.getElementById("heroActionContainer");

      if (user) {
        heroAction.innerHTML = `
          <button class="btn btn-primary gap-2 shadow-lg" onclick="addMovieModal.showModal()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add New Movie
          </button>`;
      }

      await loadActorsDropdown();
      await loadMovies();

      document.getElementById("filterForm").addEventListener("submit", (e) => {
        e.preventDefault();
        loadMovies();
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchInput").value = "";
        document.getElementById("actorSelect").value = "";
        loadMovies();
      });

      // Add Movie Form Handler
      const addForm = document.getElementById("addMovieForm");
      addForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();
        const btn = document.getElementById("saveMovieBtn");
        setLoading(btn, true, "Saving...");

        const formData = new FormData(addForm);
        // Extract checked actors
        const checkedActors = Array.from(addForm.querySelectorAll("input[name='actors']:checked")).map(el => el.value);
        formData.delete("actors");
        formData.append("actors", JSON.stringify(checkedActors));

        try {
          const res = await fetch("/api/movies", {
            method: "POST",
            body: formData,
          });

          const body = await res.json();
          if (res.ok) {
            showToast("Movie created successfully!");
            addMovieModal.close();
            // Refresh the page per user instructions
            window.location.reload();
          } else {
            setLoading(btn, false);
            if (body.errors) {
              showFieldErrors(body.errors);
            } else {
              showToast(body.error || "Failed to create movie", "error");
            }
          }
        } catch (err) {
          setLoading(btn, false);
          showToast("Network error creating movie", "error");
        }
      });
    }

    init();
  </script>
</body>
</html>
